<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TiaTrex — Animal Match-Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>const PHYLO_IMG_BASE = "{% url 'phylo_image' uuid='00000000-0000-0000-0000-000000000000' %}".replace('00000000-0000-0000-0000-000000000000.png', '');</script>
  <style>
    html, body { overscroll-behavior-y: none; }
    #app-scroll { -webkit-overflow-scrolling: touch; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .shake { animation: shake 0.35s ease; }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.07); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.25s ease; }

    /* Thin scrollbar for each column */
    .col-scroll::-webkit-scrollbar { width: 3px; }
    .col-scroll::-webkit-scrollbar-track { background: transparent; }
    .col-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }

    /* Solved caret rotation */
    #solved-caret.open { transform: rotate(180deg); }
    #solved-caret { transition: transform 0.2s ease; }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased h-screen flex flex-col overflow-hidden" style="height:100dvh;">
<script>history.scrollRestoration = 'manual';</script>

<!-- Scrollable app area (everything except the bottom nav, which must always stay visible) -->
<div id="app-scroll" class="flex-1 min-h-0 overflow-hidden flex flex-col">
  <div id="main-container" class="max-w-lg mx-auto w-full px-4 pt-2 pb-2 flex-1 flex flex-col min-h-0">

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <div class="flex items-center justify-between mb-2 flex-shrink-0">
      <a href="{% url 'play' %}"
         class="w-7 h-7 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center text-gray-500 hover:text-gray-800 flex-shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="font-black text-[16px] tracking-tight">Animal Match-Up</h1>
      <!-- First-try counter -->
      <div class="flex items-center gap-1 flex-shrink-0">
        <span class="text-[16px]">🟪</span>
        <span id="purple-count" class="font-black text-[14px] text-gray-800">0</span>
      </div>
    </div>

    <!-- ── Progress bar ────────────────────────────────────────────────────── -->
    <div class="flex items-center gap-3 mb-2 flex-shrink-0">
      <span id="match-label" class="text-[11px] font-bold text-gray-500 whitespace-nowrap">0 / 10 matched</span>
      <div class="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-teal-500 rounded-full transition-all duration-500"
             style="width:0%"></div>
      </div>
    </div>

    <!-- ── Round display ───────────────────────────────────────────────────── -->
    <div id="round-display" class="flex-1 flex flex-col min-h-0">

      <p class="text-center text-[12px] font-semibold text-gray-500 mb-2 flex-shrink-0">
        Tap an animal or fact, then tap its match!
      </p>

      <!-- Two-column matching area — Animals LEFT, Facts RIGHT — plain flexbox (not CSS grid) so
           the columns stretch to fill available height reliably across browsers (including iOS Safari,
           where nested grid + overflow-auto stretching is unreliable). -->
      <div class="flex gap-2.5 flex-1 min-h-0">

        <!-- Animals column (LEFT) — independently scrollable -->
        <div class="relative flex-1 min-w-0 flex flex-col min-h-0">
          <div id="animals-col" class="col-scroll flex flex-col gap-2.5 flex-1 min-h-0 overflow-y-auto pb-5">
            <p class="text-center text-[12px] font-bold uppercase tracking-wider text-gray-400">Animals</p>
          </div>
          <!-- Fade gradient to hint at more content below -->
          <div class="absolute bottom-0 left-0 right-0 h-6 bg-gradient-to-t from-gray-50 to-transparent pointer-events-none"></div>
        </div>

        <!-- Facts column (RIGHT) — independently scrollable -->
        <div class="relative flex-1 min-w-0 flex flex-col min-h-0">
          <div id="facts-col" class="col-scroll flex flex-col gap-2.5 flex-1 min-h-0 overflow-y-auto pb-5">
            <p class="text-center text-[12px] font-bold uppercase tracking-wider text-gray-400">Facts</p>
          </div>
          <!-- Fade gradient to hint at more content below -->
          <div class="absolute bottom-0 left-0 right-0 h-6 bg-gradient-to-t from-gray-50 to-transparent pointer-events-none"></div>
        </div>

      </div>

      <!-- Solved pairs — collapsible drawer with peek, docked at the bottom. Hidden until the
           first match so it doesn't eat space from the game grid before there's anything to show. -->
      <div id="solved-section" class="hidden flex-shrink-0 mt-2">

        <!-- Toggle header with caret arrow -->
        <button onclick="toggleSolvedSection()"
                class="w-full flex items-center gap-2 mb-2 py-1 cursor-pointer">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="flex items-center gap-1.5 text-[12px] font-bold uppercase tracking-wider text-gray-400 select-none">
            <span id="solved-count-label">Solved</span>
            <svg id="solved-caret" class="w-3.5 h-3.5 text-gray-400 open"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </button>

        <!-- Peek: compact preview of most recent solved item (visible when collapsed) -->
        <div id="solved-peek" class="mb-1 hidden"></div>

        <!-- Full solved list (scrollable when many matches) -->
        <div id="solved-list" class="flex flex-col gap-2 overflow-y-auto max-h-24"></div>

      </div>

    </div><!-- /round-display -->

    <!-- ── End screen ──────────────────────────────────────────────────────── -->
    <div id="end-screen" class="hidden text-center pt-4">

      <div id="end-dino" class="text-[60px] mb-3"></div>
      <h2 class="text-[24px] font-black mb-1">Match-Up #{{ day_number }} Complete!</h2>
      <p class="text-gray-400 text-[14px] mb-6">Come back tomorrow for a new set!</p>

      <!-- Score card -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-5">
        <div id="final-purple" class="text-[36px] font-black text-purple-600 mb-0.5"></div>
        <p class="text-[12px] text-gray-400 mb-4">first try out of 20</p>
        <div id="emoji-grid" class="font-mono text-[20px] leading-relaxed tracking-wide break-all"></div>
      </div>

      <!-- Share -->
      <button onclick="shareResult()"
              class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3.5 rounded-2xl transition flex items-center justify-center gap-2 text-[16px] mb-3">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span id="share-label">Share</span>
      </button>

      <!-- Review Facts -->
      <button id="review-toggle" onclick="toggleReviewFacts()"
              class="w-full border border-gray-200 hover:border-gray-300 bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3.5 rounded-2xl transition flex items-center justify-center gap-2 text-[16px] mb-3">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>
        </svg>
        <span id="review-toggle-label">Review Facts</span>
      </button>

      <!-- Full list of everything matched this game, reusing the same row markup as the in-round drawer -->
      <div id="review-list" class="hidden flex flex-col gap-2 text-left overflow-y-auto mb-3" style="max-height:50vh;"></div>

      <button onclick="replayGame()"
              class="w-full border border-gray-200 hover:border-gray-300 bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3.5 rounded-2xl transition text-[16px]">
        Play Again
      </button>

    </div><!-- /end-screen -->

    <!-- Next-round bar — a normal flex sibling so it sits right above the nav without overlapping content -->
    <div id="next-bar" class="hidden flex-shrink-0 flex justify-center pt-2 pb-1">
      <button id="next-btn" onclick="nextRound()"
              class="bg-gray-900 hover:bg-gray-700 active:scale-95 text-white font-bold px-8 py-2.5 rounded-full text-[14px] shadow-lg transition flex items-center gap-2">
        <span id="next-label">Next</span>
        <span class="text-[16px] leading-none">›</span>
      </button>
    </div>

  </div>
</div><!-- /app-scroll -->

<!-- Bottom nav — always visible, pinned by the flex-column body -->
<nav class="flex-shrink-0 bg-white border-t border-gray-200" style="padding-bottom:env(safe-area-inset-bottom);">
  <div class="max-w-lg mx-auto flex">
    <a href="{% url 'play' %}" class="flex-1 flex flex-col items-center gap-0 py-0.5 text-blue-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-[15px] h-[15px]" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm-1.5 14.5v-9l6 4.5Z"/>
      </svg>
    </a>
    <a href="{% url 'explore' %}" class="flex-1 flex flex-col items-center gap-0 py-0.5 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-[15px] h-[15px]" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </a>
    <a href="{% url 'credits' %}" class="flex-1 flex flex-col items-center gap-0 py-0.5 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-[15px] h-[15px]" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
      </svg>
    </a>
  </div>
</nav>

<script>
const rounds  = {{ rounds_json|safe }};
const DAY     = {{ day_number }};
const TODAY   = '{{ today_iso }}';
const STORAGE = `tiatrex-match-${TODAY}`;
const N       = rounds.length;

const ANIMAL_EMOJIS = ['🦖','🦕','🐘','🦁','🐋','🦈','🦅','🐢','🦊','🐺','🦒','🦓','🐊','🦜','🦩','🦭','🐙','🦑','🦞','🦋','🐬','🦔','🦡','🦦','🦥','🐧','🦃','🦚','🦌','🐍','🦎','🦏','🦛','🐠','🦐'];
const DAILY_EMOJI   = ANIMAL_EMOJIS[DAY % ANIMAL_EMOJIS.length];

// Timing for the "fly to solved drawer" animation on a correct match
const POP_MS = 250;   // matches the .pop keyframe duration on the animal card
const FLY_MS = 380;   // duration of the flight from the grid down to the drawer
const SETTLE_MS = POP_MS + FLY_MS;

// ── Persistent state ──────────────────────────────────────────────────────────
let current     = 0;
let purpleCount = 0;
let roundEmoji  = new Array(N).fill(null);
let allSolvedPairs = []; // every matched {animal, factText, roygbivEmoji} across the whole game, for the end-screen review list

// Per-round ephemeral state (reset each round)
let selectedFactIdx   = null;
let selectedAnimalIdx = null;
let matched           = {};   // { animal_idx: true }
let wrongAttempts     = {};   // { fact_position: count } — wrong taps per fact
let solvedOpen        = true;
let solvedCount       = 0;

// ── Restore saved progress ────────────────────────────────────────────────────
const saved = JSON.parse(localStorage.getItem(STORAGE) || 'null');
if (saved) {
  current     = saved.current     ?? 0;
  purpleCount = saved.purpleCount ?? 0;
  roundEmoji  = saved.roundEmoji  ?? roundEmoji;
}

function save() {
  localStorage.setItem(STORAGE, JSON.stringify({ current, purpleCount, roundEmoji }));
}

// ── ROYGBIV scoring ───────────────────────────────────────────────────────────
function retryToEmoji(wrongCount) {
  if (!wrongCount)      return '🟪';
  if (wrongCount === 1) return '🟦';
  if (wrongCount === 2) return '🟩';
  if (wrongCount === 3) return '🟨';
  if (wrongCount === 4) return '🟧';
  return '🟥';
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function updatePurpleCount() {
  document.getElementById('purple-count').textContent = purpleCount;
}

function updateMatchProgress() {
  const count = Object.keys(matched).length;
  const total = rounds[0].animals.length;
  document.getElementById('progress-bar').style.width = (count / total * 100) + '%';
  document.getElementById('match-label').textContent = `${count} / ${total} matched`;
}

// ── Solved section drawer ─────────────────────────────────────────────────────
function toggleSolvedSection() {
  solvedOpen = !solvedOpen;
  const peek  = document.getElementById('solved-peek');
  const list  = document.getElementById('solved-list');
  const caret = document.getElementById('solved-caret');

  if (solvedOpen) {
    peek.classList.add('hidden');
    list.classList.remove('hidden');
    caret.classList.add('open');
  } else {
    peek.classList.remove('hidden');
    list.classList.add('hidden');
    caret.classList.remove('open');
  }
}

// Cap the solved list to however many rows actually fit compactly. At normal text size that's
// 2 rows; if the device's text-size setting is scaled up (rows render taller), drop to 1 so the
// drawer doesn't eat the game area — measured from the real rendered row, not guessed from a media query.
function updateSolvedListMaxHeight() {
  const list = document.getElementById('solved-list');
  const firstRow = list.querySelector('.solved-collapsed');
  if (!firstRow) return;
  const rowH = firstRow.getBoundingClientRect().height;
  if (!rowH) return;
  const NORMAL_ROW_H = 44; // a solved row's height at default (non-scaled) text size
  const rowsToShow = rowH > NORMAL_ROW_H * 1.3 ? 1 : 2;
  const gapPx = parseFloat(getComputedStyle(list).rowGap) || 8;
  list.style.maxHeight = (rowH * rowsToShow + gapPx * (rowsToShow - 1)) + 'px';
}

function updateSolvedPeek(animal, roygbivEmoji) {
  if (solvedOpen) return;
  const more = solvedCount > 1
    ? `<span class="text-[10px] text-gray-400 ml-0.5">+${solvedCount - 1} more</span>`
    : '';
  document.getElementById('solved-peek').innerHTML = `
    <div class="border-2 border-teal-200 rounded-2xl px-3 py-2 bg-teal-50 flex items-center gap-2">
      <img src="${PHYLO_IMG_BASE}${animal.uuid}.png" class="w-5 h-5 object-contain flex-shrink-0">
      <span class="text-xs font-semibold text-teal-700 flex-1 truncate">${animal.common_name}</span>
      <span class="text-[14px] flex-shrink-0">${roygbivEmoji}</span>
      ${more}
    </div>`;
}

// ── Shared markup for a solved pair — used by the solved drawer and the end-screen review list ──
function solvedRowInnerHTML(animal, factText, roygbivEmoji) {
  const extinctBadge = animal.is_extinct
    ? `<span class="text-[0.625rem] font-semibold text-rose-500 mt-0.5">† Extinct</span>` : '';
  const roygbivBadge = `<span class="text-[14px] flex-shrink-0">${roygbivEmoji}</span>`;
  return `
    <div class="solved-collapsed grid gap-2" style="grid-template-columns:1fr 1fr;">
      <div class="border-2 border-teal-200 rounded-2xl px-3 py-2 bg-teal-50">
        <div class="flex items-center gap-1.5">
          <span class="text-teal-500 font-black text-[12px] flex-shrink-0">✓</span>
          <span class="text-xs font-semibold text-teal-700 truncate flex-1">${animal.common_name}</span>
          ${roygbivBadge}
        </div>
      </div>
      <div class="border-2 border-teal-200 rounded-2xl px-3 py-2 bg-teal-50">
        <div class="flex items-center gap-1.5">
          <img src="${PHYLO_IMG_BASE}${animal.uuid}.png" class="w-6 h-6 object-contain flex-shrink-0">
          <span class="text-xs font-semibold text-teal-700 truncate flex-1">${animal.common_name}</span>
          ${roygbivBadge}
        </div>
      </div>
    </div>
    <div class="solved-expanded hidden grid gap-2 mt-1" style="grid-template-columns:1fr 1fr;">
      <div class="border-2 border-teal-200 rounded-2xl p-3 bg-teal-50">
        <p class="text-xs text-gray-700 leading-snug">${factText}</p>
        <p class="text-[0.625rem] font-bold text-teal-600 mt-2 pt-2 border-t border-teal-200 flex items-center gap-1">
          <span>✓</span> ${animal.common_name}
        </p>
      </div>
      <div class="border-2 border-teal-200 rounded-2xl p-3 bg-teal-50 flex flex-col items-center text-center">
        <div class="w-14 h-14 flex items-center justify-center mb-1.5">
          <img src="${PHYLO_IMG_BASE}${animal.uuid}.png" class="max-w-full max-h-full object-contain">
        </div>
        <p class="text-xs font-bold text-gray-800">${animal.common_name}</p>
        <p class="text-[0.625rem] italic text-gray-400 mt-0.5">${animal.taxon_name}</p>
        ${extinctBadge}
      </div>
    </div>`;
}

// ── Fly a matched card down into the solved drawer ────────────────────────────
function flyToSolved(el, duration) {
  const startRect     = el.getBoundingClientRect();
  const solvedSection = document.getElementById('solved-section');
  solvedSection.classList.remove('hidden');
  const header  = solvedSection.querySelector('button');
  const endRect = header.getBoundingClientRect();

  const dx = (endRect.left + endRect.width / 2) - (startRect.left + startRect.width / 2);
  const dy = (endRect.top + endRect.height / 2) - (startRect.top + startRect.height / 2);

  el.style.position      = 'fixed';
  el.style.left          = startRect.left + 'px';
  el.style.top           = startRect.top + 'px';
  el.style.width         = startRect.width + 'px';
  el.style.margin        = '0';
  el.style.zIndex        = '50';
  el.style.pointerEvents = 'none';

  requestAnimationFrame(() => {
    el.style.transition = `transform ${duration}ms cubic-bezier(0.4,0,0.2,1), opacity ${duration}ms ease`;
    el.style.transform   = `translate(${dx}px, ${dy}px) scale(0.2)`;
    el.style.opacity     = '0';
  });
}

// ── Build a round ─────────────────────────────────────────────────────────────
function showRound(n) {
  if (n >= N) { showEndScreen(); return; }

  selectedFactIdx   = null;
  selectedAnimalIdx = null;
  matched           = {};
  wrongAttempts     = {};
  solvedOpen        = true;
  solvedCount       = 0;

  document.getElementById('solved-list').innerHTML  = '';
  document.getElementById('solved-list').classList.remove('hidden');
  document.getElementById('solved-peek').innerHTML  = '';
  document.getElementById('solved-peek').classList.add('hidden');
  document.getElementById('solved-count-label').textContent = 'Solved';
  document.getElementById('solved-caret').classList.add('open');
  document.getElementById('solved-section').classList.add('hidden');

  updateMatchProgress();
  updatePurpleCount();

  const r = rounds[n];

  // Animals column (LEFT)
  const animalsCol = document.getElementById('animals-col');
  animalsCol.innerHTML = '<p class="text-center text-[12px] font-bold uppercase tracking-wider text-gray-400">Animals</p>';
  r.animals.forEach((animal, ai) => {
    const card = document.createElement('div');
    card.id = `animal-${ai}`;
    card.className = 'animal-card bg-white border-2 border-gray-200 rounded-2xl p-2.5 cursor-pointer select-none flex flex-col items-center text-center transition-all duration-150 active:scale-[.97]';
    card.dataset.ai = ai;
    card.dataset.animalIdx = animal.animal_idx;
    const extinctBadge = animal.is_extinct
      ? `<span class="text-[0.625rem] font-semibold text-rose-500 mt-0.5">† Extinct</span>`
      : '';
    card.innerHTML = `
      <div class="w-14 h-14 flex items-center justify-center mb-1.5">
        <img src="${PHYLO_IMG_BASE}${animal.uuid}.png" alt="${animal.common_name}"
             class="max-w-full max-h-full object-contain">
      </div>
      <p class="text-xs font-bold leading-tight text-gray-800">${animal.common_name}</p>
      <p class="text-[0.625rem] italic text-gray-400 leading-tight mt-0.5">${animal.taxon_name}</p>
      ${extinctBadge}`;
    card.addEventListener('click', () => onAnimalClick(ai));
    animalsCol.appendChild(card);
  });

  // Facts column (RIGHT)
  const factsCol = document.getElementById('facts-col');
  factsCol.innerHTML = '<p class="text-center text-[12px] font-bold uppercase tracking-wider text-gray-400">Facts</p>';
  r.facts.forEach((fact, fi) => {
    const card = document.createElement('div');
    card.id = `fact-${fi}`;
    card.className = 'fact-card bg-white border-2 border-gray-200 rounded-2xl p-3 cursor-pointer select-none transition-all duration-150 active:scale-[.97]';
    card.dataset.fi = fi;
    card.dataset.animalIdx = fact.animal_idx;
    card.innerHTML = `<p class="text-xs text-gray-700 leading-snug">${fact.text}</p>`;
    card.addEventListener('click', () => onFactClick(fi));
    factsCol.appendChild(card);
  });

  document.getElementById('next-bar').classList.add('hidden');
}

// ── Selection helpers ─────────────────────────────────────────────────────────
function selectFact(fi) {
  selectedFactIdx = fi;
  document.getElementById(`fact-${fi}`).classList.add('border-teal-400', 'bg-teal-50');
}
function deselectFact() {
  if (selectedFactIdx === null) return;
  const prev = document.getElementById(`fact-${selectedFactIdx}`);
  if (prev && !prev.dataset.matched) prev.classList.remove('border-teal-400', 'bg-teal-50');
  selectedFactIdx = null;
}
function selectAnimal(ai) {
  selectedAnimalIdx = ai;
  document.getElementById(`animal-${ai}`).classList.add('border-teal-400', 'bg-teal-50');
}
function deselectAnimal() {
  if (selectedAnimalIdx === null) return;
  const prev = document.getElementById(`animal-${selectedAnimalIdx}`);
  if (prev && !prev.dataset.matched) prev.classList.remove('border-teal-400', 'bg-teal-50');
  selectedAnimalIdx = null;
}

// ── Click handlers ────────────────────────────────────────────────────────────
function onFactClick(fi) {
  const card = document.getElementById(`fact-${fi}`);
  if (card.dataset.matched) return;

  if (selectedFactIdx === fi) { deselectFact(); return; }

  if (selectedAnimalIdx !== null) {
    const ai = selectedAnimalIdx;
    deselectAnimal();
    attemptMatch(fi, ai);
  } else {
    deselectFact();
    selectFact(fi);
  }
}

function onAnimalClick(ai) {
  const card = document.getElementById(`animal-${ai}`);
  if (card.dataset.matched) return;

  if (selectedAnimalIdx === ai) { deselectAnimal(); return; }

  if (selectedFactIdx !== null) {
    const fi = selectedFactIdx;
    deselectFact();
    attemptMatch(fi, ai);
  } else {
    deselectAnimal();
    selectAnimal(ai);
  }
}

// ── Match attempt ─────────────────────────────────────────────────────────────
function attemptMatch(fi, ai) {
  const r          = rounds[current];
  const factCard   = document.getElementById(`fact-${fi}`);
  const animalCard = document.getElementById(`animal-${ai}`);

  if (factCard.dataset.matched || animalCard.dataset.matched) return;

  const factAnimalIdx   = parseInt(factCard.dataset.animalIdx);
  const animalAnimalIdx = parseInt(animalCard.dataset.animalIdx);

  if (factAnimalIdx === animalAnimalIdx) {
    // ── Correct ──────────────────────────────────────────────────────────────
    const firstTry = !wrongAttempts[fi];
    const animal   = r.animals[ai];

    factCard.dataset.matched   = '1';
    animalCard.dataset.matched = '1';
    factCard.style.cursor      = 'default';
    animalCard.style.cursor    = 'default';

    factCard.classList.remove('border-gray-200');
    animalCard.classList.remove('border-gray-200');
    factCard.classList.add('border-teal-400', 'bg-teal-50');
    animalCard.classList.add('border-teal-400', 'bg-teal-50');
    animalCard.classList.add('pop');
    setTimeout(() => animalCard.classList.remove('pop'), 300);

    if (firstTry) {
      purpleCount++;
      updatePurpleCount();
    }

    const factText     = r.facts[fi].text;
    const roygbivEmoji = retryToEmoji(wrongAttempts[fi]);

    allSolvedPairs.push({ animal, factText, roygbivEmoji });

    // Let the highlight/pop register, then send both cards flying down into the drawer
    setTimeout(() => {
      flyToSolved(factCard, FLY_MS);
      flyToSolved(animalCard, FLY_MS);
    }, POP_MS);

    setTimeout(() => {
      factCard.remove();
      animalCard.remove();

      solvedCount++;
      document.getElementById('solved-count-label').textContent = `${solvedCount} Solved`;

      const row = document.createElement('div');
      row.className = 'solved-row cursor-pointer';
      row.style.opacity   = '0';
      row.style.transform = 'translateY(-8px) scale(0.96)';
      row.style.transition = 'opacity .25s ease, transform .25s ease';
      row.addEventListener('click', () => toggleSolvedRow(row));
      row.innerHTML = solvedRowInnerHTML(animal, factText, roygbivEmoji);

      document.getElementById('solved-list').appendChild(row);
      updateSolvedListMaxHeight();

      requestAnimationFrame(() => {
        row.style.opacity   = '1';
        row.style.transform = 'translateY(0) scale(1)';
      });
      if (solvedOpen) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Update peek (shows when drawer is collapsed)
      updateSolvedPeek(animal, roygbivEmoji);
    }, SETTLE_MS);

    matched[factAnimalIdx] = true;
    updateMatchProgress();

    if (Object.keys(matched).length === r.animals.length) {
      const emojiRow = r.facts.map((_, idx) => retryToEmoji(wrongAttempts[idx])).join('');
      roundEmoji[current] = emojiRow;
      save();
      setTimeout(() => {
        if (current < N - 1) {
          document.getElementById('next-label').textContent = 'Next Round';
          document.getElementById('next-bar').classList.remove('hidden');
        } else {
          // Last round — go straight to the results screen instead of leaving an empty
          // grid behind a "See Results" tap.
          nextRound();
        }
      }, SETTLE_MS + 100);
    }

  } else {
    // ── Wrong ────────────────────────────────────────────────────────────────
    wrongAttempts[fi] = (wrongAttempts[fi] || 0) + 1;

    factCard.classList.add('border-red-400', 'bg-red-50', 'shake');
    animalCard.classList.add('border-red-400', 'bg-red-50', 'shake');

    setTimeout(() => {
      factCard.classList.remove('border-red-400', 'bg-red-50', 'shake');
      animalCard.classList.remove('border-red-400', 'bg-red-50', 'shake');
      factCard.classList.add('border-gray-200');
      animalCard.classList.add('border-gray-200');
    }, 450);
  }
}

// ── Solved row expand/collapse (per-row toggle) ───────────────────────────────
function toggleSolvedRow(row) {
  row.querySelector('.solved-collapsed').classList.toggle('hidden');
  row.querySelector('.solved-expanded').classList.toggle('hidden');
}

// ── Navigation ────────────────────────────────────────────────────────────────
function nextRound() {
  current++;
  save();
  if (current >= N) {
    showEndScreen();
  } else {
    showRound(current);
    document.getElementById('app-scroll').scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ── End screen ────────────────────────────────────────────────────────────────
function showEndScreen() {
  document.getElementById('round-display').classList.add('hidden');
  document.getElementById('end-screen').classList.remove('hidden');
  document.getElementById('next-bar').classList.add('hidden');

  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('match-label').textContent = 'Complete!';

  document.getElementById('end-dino').textContent = DAILY_EMOJI;
  document.getElementById('final-purple').textContent = `🟪 ${purpleCount} / 20`;

  const fullRow = roundEmoji[0] || '🟥'.repeat(20);
  const chars   = Array.from(fullRow);
  const grid    = document.getElementById('emoji-grid');
  grid.innerHTML = `<div>${chars.slice(0, 10).join('')}</div><div>${chars.slice(10).join('')}</div>`;

  const reviewList = document.getElementById('review-list');
  reviewList.classList.add('hidden');
  reviewList.innerHTML = '';
  document.getElementById('review-toggle-label').textContent = 'Review Facts';
}

// ── Review facts (end screen) ───────────────────────────────────────────────
function toggleReviewFacts() {
  const list = document.getElementById('review-list');
  const open = list.classList.contains('hidden');

  if (open) {
    if (!list.childElementCount) {
      allSolvedPairs.forEach(({ animal, factText, roygbivEmoji }) => {
        const row = document.createElement('div');
        row.className = 'solved-row cursor-pointer';
        row.addEventListener('click', () => toggleSolvedRow(row));
        row.innerHTML = solvedRowInnerHTML(animal, factText, roygbivEmoji);
        list.appendChild(row);
      });
    }
    list.classList.remove('hidden');
    document.getElementById('review-toggle-label').textContent = 'Hide Facts';
  } else {
    list.classList.add('hidden');
    document.getElementById('review-toggle-label').textContent = 'Review Facts';
  }
}

// ── Share ─────────────────────────────────────────────────────────────────────
function shareResult() {
  const row        = roundEmoji[0] || '🟥'.repeat(20);
  const chars      = Array.from(row);
  const emojiBlock = chars.slice(0, 10).join('') + ' ' + chars.slice(10).join('');
  const text = `Tia T-Rex Match-Up #${DAY} ${DAILY_EMOJI}\n🟪 ${purpleCount}/20\n${emojiBlock}\nWanna find out more? https://www.happylifeunfolding.com/tiatrex/play/match/`;

  navigator.clipboard.writeText(text).then(() => {
    const lbl = document.getElementById('share-label');
    lbl.textContent = 'Copied!';
    setTimeout(() => { lbl.textContent = 'Share'; }, 2500);
  }).catch(() => {
    prompt('Copy this to share:', text);
  });
}

// ── Replay ────────────────────────────────────────────────────────────────────
function replayGame() {
  current        = 0;
  purpleCount    = 0;
  roundEmoji     = new Array(N).fill(null);
  allSolvedPairs = [];
  save();
  document.getElementById('end-screen').classList.add('hidden');
  document.getElementById('round-display').classList.remove('hidden');
  showRound(0);
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (saved && saved.current >= N && saved.roundEmoji && saved.roundEmoji[0]) {
  showEndScreen();
} else {
  showRound(current);
}
</script>
