<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiaTrex — Animal Match-Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>const PHYLO_IMG_BASE = "{% url 'phylo_image' uuid='00000000-0000-0000-0000-000000000000' %}".replace('00000000-0000-0000-0000-000000000000.png', '');</script>
  <style>
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .shake { animation: shake 0.35s ease; }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.07); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.25s ease; }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased min-h-screen">

<div class="max-w-lg mx-auto px-4 pt-5 pb-28">

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <div class="flex items-center justify-between mb-4">
    <a href="{% url 'play' %}"
       class="w-9 h-9 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center text-gray-500 hover:text-gray-800 flex-shrink-0">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </a>
    <h1 class="font-black text-lg tracking-tight">Animal Match-Up</h1>
    <!-- Stars counter -->
    <div class="flex items-center gap-1 flex-shrink-0">
      <svg class="w-5 h-5 text-amber-400 fill-amber-400" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span id="star-count" class="font-black text-base text-gray-800">0</span>
    </div>
  </div>

  <!-- ── Progress bar ────────────────────────────────────────────────────── -->
  <div class="flex items-center gap-3 mb-5">
    <span id="round-label" class="text-xs font-bold text-gray-500 whitespace-nowrap">Round 1/5</span>
    <div class="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden">
      <div id="progress-bar" class="h-full bg-teal-500 rounded-full transition-all duration-500"
           style="width:0%"></div>
    </div>
  </div>

  <!-- ── Round display ───────────────────────────────────────────────────── -->
  <div id="round-display">

    <p class="text-center text-sm font-semibold text-gray-500 mb-4">
      Match each fact to the correct animal!
    </p>

    <!-- Two-column matching grid -->
    <div class="grid grid-cols-2 gap-2.5">

      <!-- Facts column -->
      <div id="facts-col" class="flex flex-col gap-2.5">
        <p class="text-center text-xs font-bold uppercase tracking-wider text-gray-400">Facts</p>
      </div>

      <!-- Animals column -->
      <div id="animals-col" class="flex flex-col gap-2.5">
        <p class="text-center text-xs font-bold uppercase tracking-wider text-gray-400">Animals</p>
      </div>

    </div>

    <!-- Next round button (hidden until round complete) -->
    <div id="next-wrap" class="hidden mt-5">
      <button id="next-btn" onclick="nextRound()"
              class="w-full bg-gray-900 hover:bg-gray-700 text-white font-bold py-3.5 rounded-2xl transition text-sm">
      </button>
    </div>

  </div><!-- /round-display -->

  <!-- ── End screen ──────────────────────────────────────────────────────── -->
  <div id="end-screen" class="hidden text-center pt-4">

    <div class="text-6xl mb-3">🦖</div>
    <h2 class="text-2xl font-black mb-1">Match-Up #{{ day_number }} Complete!</h2>
    <p class="text-gray-400 text-sm mb-6">Come back tomorrow for a new set!</p>

    <!-- Score card -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-5">
      <div id="final-stars" class="text-5xl font-black text-amber-500 mb-1"></div>
      <p class="text-xs text-gray-400 mb-3">stars out of 20</p>
      <div id="emoji-grid" class="font-mono text-lg leading-relaxed"></div>
    </div>

    <!-- Per-round breakdown -->
    <div id="round-breakdown" class="space-y-2 mb-6 text-left"></div>

    <!-- Share -->
    <button onclick="shareResult()"
            class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3.5 rounded-2xl transition flex items-center justify-center gap-2 text-base mb-3">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      <span id="share-label">Share Result</span>
    </button>

    <button onclick="replayGame()"
            class="w-full border border-gray-200 hover:border-gray-300 bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3.5 rounded-2xl transition text-base">
      Play Again
    </button>

  </div><!-- /end-screen -->

</div>

<script>
const rounds  = {{ rounds_json|safe }};
const DAY     = {{ day_number }};
const TODAY   = '{{ today_iso }}';
const STORAGE = `tiatrex-match-${TODAY}`;
const N       = rounds.length;

// ── Persistent state ──────────────────────────────────────────────────────────
let current    = 0;
let totalStars = 0;
let roundStars = new Array(N).fill(null);  // stars earned per round (0–4)
let roundEmoji = new Array(N).fill(null);  // emoji string per round

// Per-round ephemeral state (reset each round)
let selectedFactIdx = null;   // 0–3, which fact card is active
let matched         = {};     // { animal_idx: true } for completed pairs
let wrongAttempts   = {};     // { fact_position: true } if a wrong guess was made for this fact

// ── Restore saved progress ────────────────────────────────────────────────────
const saved = JSON.parse(localStorage.getItem(STORAGE) || 'null');
if (saved) {
  current    = saved.current    ?? 0;
  totalStars = saved.totalStars ?? 0;
  roundStars = saved.roundStars ?? roundStars;
  roundEmoji = saved.roundEmoji ?? roundEmoji;
}

function save() {
  localStorage.setItem(STORAGE, JSON.stringify({ current, totalStars, roundStars, roundEmoji }));
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function updateStarCount() {
  document.getElementById('star-count').textContent = totalStars;
}

function updateProgress(roundIdx) {
  const pct = (roundIdx / N) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('round-label').textContent = `Round ${roundIdx + 1}/${N}`;
}

// ── Build a round ─────────────────────────────────────────────────────────────
function showRound(n) {
  if (n >= N) { showEndScreen(); return; }

  selectedFactIdx = null;
  matched         = {};
  wrongAttempts   = {};

  updateProgress(n);
  updateStarCount();

  const r = rounds[n];

  // Facts column
  const factsCol = document.getElementById('facts-col');
  factsCol.innerHTML = '<p class="text-center text-xs font-bold uppercase tracking-wider text-gray-400">Facts</p>';
  r.facts.forEach((fact, fi) => {
    const card = document.createElement('div');
    card.id = `fact-${fi}`;
    card.className = 'fact-card bg-white border-2 border-gray-200 rounded-2xl p-3 cursor-pointer select-none transition-all duration-150 active:scale-[.97]';
    card.dataset.fi = fi;
    card.dataset.animalIdx = fact.animal_idx;
    card.innerHTML = `<p class="text-xs text-gray-700 leading-snug">${fact.text}</p>`;
    card.addEventListener('click', () => onFactClick(fi));
    factsCol.appendChild(card);
  });

  // Animals column
  const animalsCol = document.getElementById('animals-col');
  animalsCol.innerHTML = '<p class="text-center text-xs font-bold uppercase tracking-wider text-gray-400">Animals</p>';
  r.animals.forEach((animal, ai) => {
    const card = document.createElement('div');
    card.id = `animal-${ai}`;
    card.className = 'animal-card bg-white border-2 border-gray-200 rounded-2xl p-2.5 cursor-pointer select-none flex flex-col items-center text-center transition-all duration-150 active:scale-[.97]';
    card.dataset.ai = ai;
    card.dataset.animalIdx = animal.animal_idx;
    card.innerHTML = `
      <div class="w-14 h-14 flex items-center justify-center mb-1.5">
        <img src="${PHYLO_IMG_BASE}${animal.uuid}.png" alt="${animal.common_name}"
             class="max-w-full max-h-full object-contain">
      </div>
      <p class="text-xs font-bold leading-tight text-gray-800">${animal.common_name}</p>
      <p class="text-[10px] italic text-gray-400 leading-tight mt-0.5">${animal.taxon_name}</p>`;
    card.addEventListener('click', () => onAnimalClick(ai));
    animalsCol.appendChild(card);
  });

  document.getElementById('next-wrap').classList.add('hidden');
}

// ── Click handlers ────────────────────────────────────────────────────────────
function onFactClick(fi) {
  const r = rounds[current];
  const card = document.getElementById(`fact-${fi}`);

  // Ignore if already matched
  if (card.dataset.matched) return;

  if (selectedFactIdx === fi) {
    // Deselect
    selectedFactIdx = null;
    card.classList.remove('border-teal-400', 'bg-teal-50');
    return;
  }

  // Deselect any previously selected
  if (selectedFactIdx !== null) {
    const prev = document.getElementById(`fact-${selectedFactIdx}`);
    if (prev && !prev.dataset.matched) {
      prev.classList.remove('border-teal-400', 'bg-teal-50');
    }
  }

  selectedFactIdx = fi;
  card.classList.add('border-teal-400', 'bg-teal-50');
}

function onAnimalClick(ai) {
  if (selectedFactIdx === null) return;

  const r          = rounds[current];
  const factCard   = document.getElementById(`fact-${selectedFactIdx}`);
  const animalCard = document.getElementById(`animal-${ai}`);

  if (factCard.dataset.matched || animalCard.dataset.matched) return;

  const factAnimalIdx   = parseInt(factCard.dataset.animalIdx);
  const animalAnimalIdx = parseInt(animalCard.dataset.animalIdx);
  const fi              = selectedFactIdx;

  if (factAnimalIdx === animalAnimalIdx) {
    // ── Correct ──────────────────────────────────────────────────────────────
    const firstTry = !wrongAttempts[fi];
    const animal   = r.animals[ai];

    // Lock both cards
    factCard.dataset.matched   = '1';
    animalCard.dataset.matched = '1';
    factCard.style.cursor      = 'default';
    animalCard.style.cursor    = 'default';

    factCard.classList.remove('border-teal-400', 'bg-teal-50', 'border-gray-200');
    animalCard.classList.remove('border-gray-200');
    factCard.classList.add('border-teal-400', 'bg-teal-50');
    animalCard.classList.add('border-teal-400', 'bg-teal-50');

    // Reveal animal name on fact card
    const label = document.createElement('p');
    label.className = 'text-[10px] font-bold text-teal-600 mt-2 pt-2 border-t border-teal-200 flex items-center gap-1';
    label.innerHTML = `<span class="text-teal-500">✓</span> ${animal.common_name}`;
    factCard.appendChild(label);

    // Star animation on animal card
    if (firstTry) {
      totalStars++;
      updateStarCount();
      const starEl = document.createElement('div');
      starEl.className = 'text-amber-400 text-base pop';
      starEl.textContent = '⭐';
      animalCard.appendChild(starEl);
    }

    animalCard.classList.add('pop');
    setTimeout(() => animalCard.classList.remove('pop'), 300);

    selectedFactIdx = null;
    matched[factAnimalIdx] = true;

    // Check round complete
    if (Object.keys(matched).length === 4) {
      const stars = Object.values(wrongAttempts).length === 0 ? 4 :
        r.facts.filter((_, idx) => !wrongAttempts[idx]).length;
      roundStars[current] = stars;

      // Build emoji string for this round
      const emojiRow = r.facts.map((_, idx) => wrongAttempts[idx] ? '🟨' : '🟩').join('');
      roundEmoji[current] = emojiRow;
      save();

      setTimeout(() => {
        const nextBtn = document.getElementById('next-btn');
        nextBtn.textContent = current < N - 1 ? 'Next Round →' : 'See Results →';
        document.getElementById('next-wrap').classList.remove('hidden');
      }, 400);
    }

  } else {
    // ── Wrong ────────────────────────────────────────────────────────────────
    wrongAttempts[fi] = true;

    // Flash both cards red
    factCard.classList.remove('border-teal-400', 'bg-teal-50');
    factCard.classList.add('border-red-400', 'bg-red-50', 'shake');
    animalCard.classList.add('border-red-400', 'bg-red-50', 'shake');

    selectedFactIdx = null;

    setTimeout(() => {
      factCard.classList.remove('border-red-400', 'bg-red-50', 'shake');
      animalCard.classList.remove('border-red-400', 'bg-red-50', 'shake');
      factCard.classList.add('border-gray-200');
      animalCard.classList.add('border-gray-200');
    }, 450);
  }
}

// ── Navigation ────────────────────────────────────────────────────────────────
function nextRound() {
  current++;
  save();
  if (current >= N) {
    showEndScreen();
  } else {
    showRound(current);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ── End screen ────────────────────────────────────────────────────────────────
function showEndScreen() {
  document.getElementById('round-display').classList.add('hidden');
  document.getElementById('end-screen').classList.remove('hidden');

  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('round-label').textContent = 'Complete!';

  document.getElementById('final-stars').textContent = `⭐ ${totalStars}`;

  // Emoji grid — one row per round
  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = roundEmoji.map(row => `<div class="tracking-widest">${row || '🟥🟥🟥🟥'}</div>`).join('');

  // Per-round breakdown
  const bd = document.getElementById('round-breakdown');
  bd.innerHTML = '';
  rounds.forEach((r, i) => {
    const stars = roundStars[i] ?? 0;
    const div   = document.createElement('div');
    div.className = 'flex items-center gap-3 p-3 rounded-xl bg-white border border-gray-100';
    div.innerHTML = `
      <span class="text-lg flex-shrink-0">${roundEmoji[i] || '🟥🟥🟥🟥'}</span>
      <div class="flex-1 min-w-0 text-left">
        <p class="text-xs font-semibold text-gray-700">Round ${i + 1}</p>
        <p class="text-xs text-gray-400">${stars}/4 first try</p>
      </div>
      <span class="text-sm font-bold text-amber-500 flex-shrink-0">⭐ ${stars}</span>`;
    bd.appendChild(div);
  });
}

// ── Share ─────────────────────────────────────────────────────────────────────
function shareResult() {
  const emojiBlock = roundEmoji.map(row => row || '🟥🟥🟥🟥').join('\n');
  const text = `TiaTrex Match-Up #${DAY} 🦕\n⭐ ${totalStars}/20\n${emojiBlock}\n${window.location.origin}/play/match/`;

  navigator.clipboard.writeText(text).then(() => {
    const lbl = document.getElementById('share-label');
    lbl.textContent = 'Copied!';
    setTimeout(() => { lbl.textContent = 'Share Result'; }, 2500);
  }).catch(() => {
    prompt('Copy this to share:', text);
  });
}

// ── Replay ────────────────────────────────────────────────────────────────────
function replayGame() {
  current    = 0;
  totalStars = 0;
  roundStars = new Array(N).fill(null);
  roundEmoji = new Array(N).fill(null);
  save();
  document.getElementById('end-screen').classList.add('hidden');
  document.getElementById('round-display').classList.remove('hidden');
  showRound(0);
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (saved && saved.current >= N && roundStars.every(s => s !== null)) {
  showEndScreen();
} else {
  showRound(current);
}
</script>

<!-- Bottom nav -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-10">
  <div class="max-w-lg mx-auto flex">
    <a href="{% url 'play' %}" class="flex-1 flex flex-col items-center gap-0.5 py-3 text-blue-600">
      <div class="w-11 h-7 bg-blue-50 rounded-2xl flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm-1.5 14.5v-9l6 4.5Z"/>
        </svg>
      </div>
      <span class="text-xs font-semibold">Play</span>
    </a>
    <a href="{% url 'explore' %}" class="flex-1 flex flex-col items-center gap-0.5 py-3 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <span class="text-xs font-medium">Explore</span>
    </a>
    <a href="{% url 'credits' %}" class="flex-1 flex flex-col items-center gap-0.5 py-3 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
      </svg>
      <span class="text-xs font-medium">Credits</span>
    </a>
  </div>
</nav>

</body>
</html>
